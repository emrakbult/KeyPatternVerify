[project]
name = "keystroke-dynamics-auth"
version = "0.1.0"
description = "CMU keystroke dynamics authentication with k-NN anomaly scoring."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
keystroke-auth = "keystroke_auth.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"keystroke_auth.web" = [
  "static/*",
  "static/vendor/*",
]
